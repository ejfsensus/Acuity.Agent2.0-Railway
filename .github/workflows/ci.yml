name: CI/CD

permissions:
  contents: read

env:
  HUSKY: '0'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  BETTER_AUTH_SECRET: ci-build-placeholder-replaced-at-runtime
  NITRO_PRESET: node-server
  NUXT_HUB_DB_DRIVER: postgres-js
  NODE_OPTIONS: --max-old-space-size=4096

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 💅 Lint code
        run: bun run lint

      - name: 🧪 Run tests
        run: bun run test

      - name: Type check
        run: bun run typecheck

      - name: Build production app and packages
        run: bun run build
